<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual - Sistema de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Loja Virtual</h1>
            <p>Sistema de Vendas com Estoque</p>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="loja">Loja</button>
            <button class="tab-btn" data-tab="admin">Administração</button>
            <button class="tab-btn" data-tab="pedidos">Meus Pedidos</button>
        </div>

        <div class="content">
            <!-- SEÇÃO: LOJA -->
            <div id="loja" class="section active">
                <div id="msg-loja"></div>
                <div class="product-grid" id="produtos-grid"></div>
                
                <div class="cart-summary" id="carrinho-resumo">
                    <h3>🛒 Carrinho de Compras</h3>
                    <div id="carrinho-items"></div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total-carrinho">R$ 0,00</span>
                    </div>
                    <button onclick="irParaCheckout()">Ir para Checkout</button>
                </div>
            </div>

            <!-- SEÇÃO: ADMIN -->
            <div id="admin" class="section">
                <h2>Gerenciar Produtos</h2>
                
                <div class="form-container">
                    <h3>Novo Produto</h3>
                    <div class="form-group">
                        <label>Nome do Produto</label>
                        <input type="text" id="nome-produto" placeholder="Ex: Notebook">
                    </div>
                    <div class="form-group">
                        <label>Preço (R$)</label>
                        <input type="number" id="preco-produto" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Quantidade em Estoque</label>
                        <input type="number" id="estoque-produto" min="0">
                    </div>
                    <button onclick="adicionarProduto()">Adicionar Produto</button>
                </div>

                <table class="table" id="tabela-produtos">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="produtos-tbody"></tbody>
                </table>
            </div>

            <!-- SEÇÃO: PEDIDOS -->
            <div id="pedidos" class="section">
                <h2>Histórico de Pedidos</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Detalhes</th>
                        </tr>
                    </thead>
                    <tbody id="pedidos-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT -->
    <div id="checkout-modal">
        <div style="background: white; padding: 30px;">
            <h2>Finalizar Compra</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cliente-nome" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cliente-email" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="cliente-tel" required>
                </div>
                <div class="form-group">
                    <label>Endereço</label>
                    <input type="text" id="cliente-endereco" required>
                </div>
                <div class="form-group">
                    <label>Método de Pagamento</label>
                    <select id="metodo-pagamento" required>
                        <option value="">Selecione...</option>
                        <option value="cartao">Cartão de Crédito</option>
                        <option value="pix">PIX</option>
                        <option value="boleto">Boleto</option>
                        <option value="transferencia">Transferência Bancária</option>
                    </select>
                </div>
                <button type="submit">Confirmar Pedido</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
